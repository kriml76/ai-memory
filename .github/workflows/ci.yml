name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: unit + fixture replay
        run: npx vitest run
      - name: 验收断言——fixture 必须全绿
        run: |
          npx vitest run --reporter=verbose 2>&1 | tee vitest.log
          grep -q "failed" vitest.log && exit 1 || true
