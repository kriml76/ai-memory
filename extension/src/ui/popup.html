<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>AI Forget</title>
  <style>
    body { font-family: system-ui, sans-serif; width: 320px; padding: 16px; }
    h1 { font-size: 16px; margin: 0 0 12px; }
    .stat { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; }
    .due { color: #b45309; font-weight: 600; }
  </style>
</head>
<body>
  <h1>AI Forget</h1>
  <div id="stats">
    <div class="stat"><span>待复习</span><span class="due" id="due-count">—</span></div>
    <div class="stat"><span>已掌握</span><span id="mastered-count">—</span></div>
    <div class="stat"><span>学习模式对话</span><span id="study-count">—</span></div>
  </div>
  <p style="font-size:12px;color:#666">原始记录仅存储于本机 IndexedDB。</p>
</body>
</html>
